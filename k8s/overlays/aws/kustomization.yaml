apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

secretGenerator:
  - name: rds-secret
    namespace: store
    envs:
      - ../../../api/.secrets/rds.env

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: store/account
    newName: rafaeldbo/account
    newTag: latest
  - name: store/auth
    newName: rafaeldbo/auth
    newTag: latest
  - name: store/product
    newName: rafaeldbo/product
    newTag: latest
  - name: store/exchange
    newName: rafaeldbo/exchange
    newTag: latest
  - name: store/gateway
    newName: rafaeldbo/gateway
    newTag: latest
  - name: store/order
    newName: rafaeldbo/order
    newTag: latest

patches:
  - path: postgres-emptydir.yaml
  - target:
      kind: Deployment
      name: db
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: data
          emptyDir: {}
  - target:
      kind: Deployment
      name: account
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: rds-secret
  - target:
      kind: Deployment
      name: auth
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: product
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: rds-secret
  - target:
      kind: Deployment
      name: exchange
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: order
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: rds-secret
