name: store

# metrics, logs and dashboards (submodule: organizacao-do-sucesso/observability)
include:
  - ./observability/compose.yaml

services:

  db:
    image: postgres:17
    hostname: db
    ports:
      - 5432:5432
    volumes:
      - ${VOLUME_DB}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
      POSTGRES_DB: ${DB_NAME:-store}
    healthcheck:
      # -h forces TCP: during initdb the temporary server only listens on the unix socket
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    hostname: redis
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  account:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    hostname: account
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:-devpass}
      ADMIN_NAME: ${ADMIN_NAME:-Store Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@store.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy

  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    hostname: auth
    deploy:
      replicas: 1
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_HTTP_ONLY: ${JWT_HTTP_ONLY:-true}
    depends_on:
      - account

  product:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    hostname: product
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:-devpass}
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy

  order:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    hostname: order
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:-devpass}
    labels:
      prometheus.scrape: "true"
      prometheus.port: "8080"
      prometheus.path: /order/actuator/prometheus
      logs.collect: "true"
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
      product:
        condition: service_started
      exchange:
        condition: service_started

  exchange:
    build:
      context: ./exchange-service
      dockerfile: Dockerfile
    hostname: exchange
    environment:
      EXCHANGE_API_URL: ${EXCHANGE_API_URL:-https://economia.awesomeapi.com.br}
      EXCHANGE_CACHE_TTL_SECONDS: ${EXCHANGE_CACHE_TTL_SECONDS:-60}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    labels:
      logs.collect: "true"
    deploy:
      replicas: 1
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    hostname: gateway
    environment:
      CORS_ALLOWED_CREDENTIALS: ${CORS_ALLOWED_CREDENTIALS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - 8080:8080